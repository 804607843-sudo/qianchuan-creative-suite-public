<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千川优质工具 - 公开版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#18181b;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid #e4e4e7}.head{max-width:1600px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:center;position:relative}.brand{display:flex;gap:12px;align-items:center;justify-content:center;text-align:center}.status{position:absolute;right:24px}.logo{width:40px;height:40px;border-radius:12px;background:#18181b;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:8px}.logo i{width:4px;border-radius:3px;background:#fb923c}.logo i:nth-child(1){height:8px}.logo i:nth-child(2){height:16px}.logo i:nth-child(3){height:24px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.2em;color:#a1a1aa}.title{font-size:18px;font-weight:700}.creator,.source{font-size:12px;color:#71717a}.status{font-size:12px;border:1px solid #e4e4e7;border-radius:999px;padding:6px 10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;margin-right:7px}.source{max-width:1600px;margin:auto;padding:0 24px 10px}.tabs{background:#fff;border-bottom:1px solid #e4e4e7}.tabrow{max-width:900px;margin:auto;padding:0 24px;display:flex;justify-content:center;overflow-x:auto}.tab{flex:1;max-width:260px;min-width:200px;border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 16px;text-align:center;cursor:pointer}.tab:hover{background:#fafafa}.tab.active{background:#fff7ed;border-bottom-color:#f97316}.tab strong{display:block;font-size:14px}.tab small{font-size:12px;color:#71717a}.main{max-width:1600px;margin:auto;padding:24px}.panel{position:relative;height:calc(100vh - 190px);min-height:600px;overflow:hidden;border:1px solid #e4e4e7;border-radius:16px;background:#fff}.panel iframe{width:100%;height:100%;border:0}.open{position:absolute;right:16px;top:16px;z-index:2;width:38px;height:38px;border:1px solid #ddd;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;text-decoration:none;color:#333}.footer{text-align:center;color:#71717a;font-size:12px;padding:4px 16px 16px}@media(max-width:700px){.head,.source,.tabrow{padding-left:14px;padding-right:14px}.status{display:none}.main{padding:14px}.tab{min-width:178px}.panel{height:calc(100vh - 205px)}}
</style>
</head>
<body>
<header class="header"><div class="head"><div class="brand"><div class="logo"><i></i><i></i><i></i></div><div><div class="eyebrow">QIANCHUAN CREATIVE SUITE</div><div class="title">千川优质工具</div></div></div><div class="status"><span class="dot"></span>四项工具已接入</div></div></header>
<nav class="tabs"><div class="tabrow" id="tabs"></div></nav>
<main class="main">
  <section class="panel">
    <a class="open" id="open" target="_blank" rel="noreferrer" title="在新窗口打开">↗</a>
    <iframe id="frame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>
</main>
<footer class="footer">页面数据可见性与所引用的数据源权限保持一致｜本页面托管于 GitHub Pages</footer>
<script>
const tools=[
{id:'insight',title:'爆款素材洞察',sub:'榜单 · 行业趋势 · 黄金 3S',url:'https://804607843-sudo.github.io/'},
{id:'reference',title:'优质素材参考',sub:'榜单 · 爆款拆解 · 素材公式',url:'https://magic.solutionsuite.cn/app/vuGLD01LO3j'},
{id:'script',title:'优质脚本生成',sub:'脚本 · 提示词 · 合规自检',url:'https://data.bytedance.net/apps/2866488'},
{id:'calculator',title:'素材经营计算器',sub:'经营测算 · 效率评估 · 决策参考',url:'https://804607843-sudo.github.io/material-team-multi-client-calculator/lark-material-team-calculator.html'}];
const tabs=document.getElementById('tabs'),frame=document.getElementById('frame'),open=document.getElementById('open');
function activate(id){
    const t=tools.find(x=>x.id===id)||tools[0];
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===t.id));
    frame.title=t.title;
    frame.src=t.url;
    open.href=t.url;
    history.replaceState(null,'','#'+t.id);
}
tools.forEach(t=>{const b=document.createElement('button');b.className='tab';b.dataset.id=t.id;b.innerHTML=`<strong>${t.title}</strong><small>${t.sub}</small>`;b.onclick=()=>activate(t.id);tabs.appendChild(b)});activate(location.hash.slice(1));
</script>
</body></html>
